name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # run.sh drives lint/unit/e2e exactly like on a developer machine, just with Docker.
  CONTAINER_ENGINE: docker
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  lint:
    name: Lint (php -l, shellcheck, PHPStan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./run.sh lint

  unit:
    name: Unit + integration tests (PHPUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./run.sh unit

  e2e:
    name: E2E tests (Playwright vs. mock RouterOS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./run.sh e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  arm-smoke:
    name: ARM smoke test (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            platform: linux/arm64
          - arch: armv7
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          load: true
          tags: panag:smoke
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Start under emulation, check health and size budget
        run: |
          docker run -d --name smoke --platform ${{ matrix.platform }} -p 8080:8080 panag:smoke
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/healthz.php && break
            sleep 2
          done
          echo
          curl -fsS http://127.0.0.1:8080/healthz.php | grep -q '"status":"ok"'
          curl -fsS -o /dev/null http://127.0.0.1:8080/login.php
          docker exec smoke sh -c 'uname -m; php -v | head -1'
          size=$(docker image inspect panag:smoke --format '{{.Size}}')
          echo "Image size: $((size / 1024 / 1024)) MB"
          if [ "$size" -gt $((50 * 1024 * 1024)) ]; then
            echo "::error::Image exceeds the 50 MB budget for the MikroTik hEX S"
            exit 1
          fi
      - name: Container logs
        if: failure()
        run: docker logs smoke || true

  publish:
    name: Publish multi-arch image to GHCR
    if: github.event_name == 'push'
    needs: [lint, unit, e2e, arm-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=edge,branch=main
            type=sha
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish

  release:
    name: GitHub release with RouterOS image tarballs
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: VERSION must match the tag
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${version#[vV]}" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::VERSION file ($version) does not match tag ($GITHUB_REF_NAME)"
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Export docker-archive tarballs (for /container add file=...)
        run: |
          mkdir -p dist
          for target in arm64:linux/arm64 armv7:linux/arm/v7; do
            arch="${target%%:*}"; platform="${target#*:}"
            docker buildx build --platform "$platform" --target runtime \
              --cache-from type=gha,scope=publish \
              -t "panag:${GITHUB_REF_NAME}" \
              --output "type=docker,dest=dist/panag-${GITHUB_REF_NAME}-${arch}.tar" .
          done
          ls -lh dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes --title "PANAG $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/*.tar --clobber
