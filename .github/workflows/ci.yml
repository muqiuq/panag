name: CI

# Push to main and pull requests: tests only.
# Tag v*: one image per architecture, smoke-tested, pushed as ghcr.io/<repo>:<tag>-<arch> and attached to the
# GitHub release as panag-<tag>-<arch>.tar. No edge, latest, sha-… or multi-arch tags.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # run.sh drives lint/unit/e2e exactly like on a developer machine, just with Docker.
  CONTAINER_ENGINE: docker
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  lint:
    name: Lint (php -l, shellcheck, PHPStan)
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./run.sh lint

  unit:
    name: Unit + integration tests (PHPUnit)
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./run.sh unit

  e2e:
    name: E2E tests (Playwright vs. mock RouterOS, ${{ matrix.os }})
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # alpine = amd64/arm64 images; debian = the 32-bit ARM image's runtime, here natively on amd64.
        os: [alpine, debian]
    steps:
      - uses: actions/checkout@v7
      - run: ./run.sh e2e
        env:
          CI: "true"
          PANAG_RUNTIME_OS: ${{ matrix.os }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  image:
    name: Image ${{ github.ref_name }}-${{ matrix.arch }}
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    strategy:
      # one failing architecture stops the others – the release only happens with all images
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            budget_mb: 50
          - arch: arm64
            platform: linux/arm64
            budget_mb: 50
          # Official php image on Debian bookworm (Alpine armv7 dies with SIGILL on RouterOS), bigger than Alpine.
          - arch: arm
            platform: linux/arm/v7
            budget_mb: 150
    env:
      # (the workflow-level env context is not available here)
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ matrix.arch }}
      TARBALL: panag-${{ github.ref_name }}-${{ matrix.arch }}.tar
    steps:
      - uses: actions/checkout@v7
      - name: VERSION must match the tag
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${version#[vV]}" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::VERSION file ($version) does not match tag ($GITHUB_REF_NAME)"
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: false
          sbom: false
          # docker-archive for RouterOS (/container/add file=...); the same file is loaded, tested and pushed
          outputs: type=docker,dest=${{ env.TARBALL }}
      - name: Start (under emulation for ARM), check health and size budget
        run: |
          docker load -i "$TARBALL"
          docker run -d --name smoke --platform ${{ matrix.platform }} -p 8080:8080 "$IMAGE"
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/healthz.php && break
            sleep 2
          done
          echo
          curl -fsS http://127.0.0.1:8080/healthz.php | grep -q '"status":"ok"'
          curl -fsS -o /dev/null http://127.0.0.1:8080/login.php
          docker exec smoke sh -c 'uname -m; php -v | head -1'
          size=$(docker image inspect "$IMAGE" --format '{{.Size}}')
          echo "Image size: $((size / 1024 / 1024)) MB"
          if [ "$size" -gt $((${{ matrix.budget_mb }} * 1024 * 1024)) ]; then
            echo "::error::Image exceeds the ${{ matrix.budget_mb }} MB budget for ${{ matrix.platform }}"
            exit 1
          fi
      - name: Container logs
        if: failure()
        run: docker logs smoke || true
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: ${{ env.TARBALL }}
          retention-days: 3
          compression-level: 0

  release:
    name: Push images and create the GitHub release
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
          path: dist
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push ${{ env.IMAGE_NAME }}:${{ github.ref_name }}-<arch>
        run: |
          ls -lh dist
          for arch in amd64 arm64 arm; do
            docker load -i "dist/panag-${GITHUB_REF_NAME}-${arch}.tar"
            docker push "${IMAGE_NAME}:${GITHUB_REF_NAME}-${arch}"
          done
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes --title "PANAG $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/*.tar --clobber
