# Minimal Apache configuration for PANAG (prefork + mod_php), tuned for small devices.
ServerRoot "/etc/apache2"
ServerName localhost
Listen 8080

LoadModule mpm_prefork_module /usr/lib/apache2/mod_mpm_prefork.so
LoadModule authz_core_module  /usr/lib/apache2/mod_authz_core.so
LoadModule dir_module         /usr/lib/apache2/mod_dir.so
LoadModule mime_module        /usr/lib/apache2/mod_mime.so
# Built into Debian's apache2 (arm/v5 image), modules on Alpine.
<IfModule !log_config_module>
    LoadModule log_config_module /usr/lib/apache2/mod_log_config.so
</IfModule>
<IfModule !unixd_module>
    LoadModule unixd_module      /usr/lib/apache2/mod_unixd.so
</IfModule>
LoadModule headers_module     /usr/lib/apache2/mod_headers.so
LoadModule setenvif_module    /usr/lib/apache2/mod_setenvif.so
LoadModule alias_module       /usr/lib/apache2/mod_alias.so
LoadModule php_module         /usr/lib/apache2/mod_php.so

# Children run as "apache" when started as root (the entrypoint keeps root only to fix /data ownership).
User apache
Group apache

PidFile /tmp/httpd.pid
ServerTokens Prod
ServerSignature Off
TraceEnable Off
Timeout 30
# With a small prefork pool, keep-alive connections would pin workers (browsers open ~6 per host)
# and stall other requests. Connections are cheap on LAN/WireGuard, so close them after each request.
KeepAlive Off

# Small footprint: one idle worker, a handful at most (APACHE_MAX_WORKERS, default 5).
StartServers 1
MinSpareServers 1
MaxSpareServers 2
ServerLimit ${APACHE_MAX_WORKERS}
MaxRequestWorkers ${APACHE_MAX_WORKERS}
MaxConnectionsPerChild 1000

ErrorLog /dev/stderr
LogLevel warn
LogFormat "%a \"%r\" %>s %b %Dus" panag
# Keep the (RouterOS) log readable: skip health checks and Apache's internal wake-up requests.
SetEnvIf Request_URI "^/healthz\.php" nolog
SetEnvIf Request_URI "^\*$" nolog
CustomLog /dev/stdout panag env=!nolog

TypesConfig /etc/apache2/mime.types
AddDefaultCharset UTF-8

DocumentRoot "/app/public"
DirectoryIndex index.php

<Directory />
    Options None
    AllowOverride None
    Require all denied
</Directory>

<Directory "/app/public">
    Options None
    AllowOverride None
    Require all granted
</Directory>

# Never serve dotfiles.
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "same-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
# Only own files: no inline scripts/styles, no external hosts. Bootstrap's CSS uses data: SVG icons.
Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Pages renamed after V0.1 (keeps old bookmarks working).
RedirectMatch 301 ^/extendedaccess\.php$ /index.php
RedirectMatch 301 ^/admin/config_user\.php$ /admin/users.php
RedirectMatch 301 ^/admin/config_networks\.php$ /admin/networks.php
RedirectMatch 301 ^/admin/config_constants\.php$ /admin/config.php
