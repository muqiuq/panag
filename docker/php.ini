; PANAG PHP settings (loaded after the distribution defaults).
expose_php = Off
; ${PHP_DISPLAY_ERRORS} is empty (= Off) unless set, e.g. in compose.dev.yml
display_errors = ${PHP_DISPLAY_ERRORS}
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

memory_limit = 64M
max_execution_time = 30
; GeoIP databases (~8–16 MB) can be uploaded on admin/monitoring.php; uploads go to a temp file, not to memory.
post_max_size = 40M
upload_max_filesize = 32M

date.timezone = UTC

; Explicit, so that both base images (Alpine, Debian for 32-bit ARM) keep and clean up sessions the same way.
session.save_path = "/tmp"
session.gc_probability = 1
session.gc_divisor = 1000
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict

opcache.enable = 1
opcache.memory_consumption = 16
opcache.interned_strings_buffer = 4
opcache.max_accelerated_files = 1000
opcache.revalidate_freq = 2
